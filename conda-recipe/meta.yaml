{% set name = "slurm-monitor-top" %}
{% set version = "0.6.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Built from the PyPI sdist; on every release bump `version` and replace the
  # hash with `sha256sum dist/slurm_monitor_top-<version>.tar.gz`.
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/slurm_monitor_top-{{ version }}.tar.gz
  sha256: 50d99ecc9d4740f849f2a8a622b1d57df172d5b690bb7118a4af691d30271c76

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - slurm-top = slurm_top.cli:main
    - stop = slurm_top.cli:main
  run_exports:
    - {{ pin_subpackage("slurm-monitor-top", max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=61
  run:
    - python >=3.9
    - rich
    - textual

test:
  # Both entry points open a full-screen TUI and never return, so they cannot
  # be executed in a build sandbox; import and metadata checks only.
  imports:
    - slurm_top
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/hforoughmand/slurm-monitor-top
  summary: htop-like monitor for Slurm jobs
  description: |
    A terminal dashboard for Slurm clusters, inspired by htop. Shows live jobs,
    nodes, GPU status and disk usage, with sorting, filtering, free-text search,
    per-job and per-node detail popups, and job control (cancel, hold, release,
    requeue). The Slurm client commands (squeue, sinfo, scontrol) must be in
    PATH at run time; they are not provided by this package.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://github.com/hforoughmand/slurm-monitor-top#readme
  dev_url: https://github.com/hforoughmand/slurm-monitor-top

extra:
  recipe-maintainers:
    - hforoughmand
